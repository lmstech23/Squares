# F7 — the first CI this repository has had.
#
# WHY IT EXISTS. `npm test` has run on one developer machine and nowhere else.
# Vercel's build command is `next build`, which does not run tests, so nothing
# automatic has ever objected to a broken commit.
#
# That is the `b771c68` failure one level up. On 2026-02-25 a correct fix was
# committed to two files; the next day a cleanup pass deleted it from both while
# "removing dead paymentPreference refs" — they were not dead, they were the fix
# — and nothing caught it for six months. The regression tests added since are
# the durable half; this workflow is the half that actually runs them.
#
# SCOPE IS DELIBERATELY NARROW. Typecheck and unit tests. No application,
# database, environment-variable or deployment changes, and this workflow
# neither deploys nor can deploy: it has read-only permissions and no secrets.
# Vercel continues to deploy from pushes to main independently of this file.
#
# TWO JOBS. `verify` is the typecheck, the Event isolation guard and the unit
# tests, unchanged. `event-database` (L0 step 7, Nov 2026) runs the Event
# database and concurrency suites against a disposable Postgres that lives and
# dies inside the runner. Neither job has a secret, and neither can reach dev
# or production: no Supabase credential exists anywhere in this workflow.

name: CI

on:
  push:
  pull_request:

# Least privilege. This workflow reads code and reports; it needs nothing else.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck and tests
    runs-on: ubuntu-latest

    env:
      # NON-FUNCTIONAL PLACEHOLDERS, AND THEY MUST STAY THAT WAY.
      #
      # `prisma generate` runs from `postinstall` and resolves the datasource
      # block, which references both of these. `.env` is gitignored, so without
      # them the install step fails on a schema it never needed to connect to.
      #
      # Nothing in this job opens a connection: the integration suite skips
      # without TEST_DATABASE_URL, and the route test mocks `@/lib/prisma` so
      # the client is never constructed. A real credential here would buy
      # nothing and put production one typo away from a CI log.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/unused
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/unused

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # PINNED EXACTLY, NOT BY RANGE. `npm test` passes
      # `--experimental-test-module-mocks`, which the route-handler test in
      # src/lib/board-creation-route.test.ts depends on. It landed in Node
      # 22.3.0, and an experimental flag carries no semver promise — a runner
      # default that drifts backwards or forwards could remove or rename it.
      # 22.19.0 is the version the suite is known to pass on.
      - name: Use Node 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install
        run: npm ci

      # EXPLICIT, THOUGH `postinstall` ALREADY RAN IT.
      #
      # CLAUDE.md: run `prisma generate` before any verification whenever
      # schema.prisma changed, because tsc and the tests read the GENERATED
      # client, not the schema file. A green suite against a stale client proves
      # only that the old client still compiles — `raffleEnabled` once passed
      # tsc and 169 tests while being invisible to TypeScript.
      #
      # Stated as its own step so the requirement survives someone removing the
      # postinstall hook.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # EVENT PATH ISOLATION. scripts/check-event-isolation.sh is the static guard
      # for RULE E2 (docs/phase0/event-path-gate-independence.md), extended at the
      # Event port: no Board, Host, credit or Stripe references on the Event
      # path, no legacy model accessors, no Prisma writes outside the command
      # layer, and nothing added under or imported from src/app/host. A grep,
      # so it needs no database and no secrets.
      - name: Event path isolation
        run: npm run check:event-isolation

      # `tee` would swallow the exit code without pipefail, turning every test
      # failure into a green run — which is precisely the class of silent pass
      # this workflow exists to prevent.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # THE SKIP IS A SIGNAL, NOT NOISE — and it must not fail the build.
      #
      # `npm test` reports "1 skipped" when the disposable Postgres is absent.
      # Per CLAUDE.md that skip means the concurrency suite — the eight
      # confirmation and pass-minting cases that are the only real-database
      # coverage of the money path — DID NOT RUN. A green check that quietly
      # omits it is worse than a red one, because it reads as complete.
      #
      # `if: always()` so the report appears even when the tests failed.
      - name: Report suite completeness
        if: always()
        shell: bash
        run: |
          if [ ! -f test-output.txt ]; then
            echo "::warning title=No test output::The test step produced no output file; completeness unknown."
            exit 0
          fi

          # `|| true` ON EVERY GREP. GitHub runs these steps as `bash -e`, and a
          # grep that matches nothing exits non-zero — which would abort the step
          # through the command substitution and turn "no summary line found"
          # into a failed build for a run whose tests all passed.
          SKIPPED=$(grep -oE '^# skipped [0-9]+' test-output.txt | awk '{print $3}' | head -1 || true)
          PASS=$(grep -oE '^# pass [0-9]+' test-output.txt | awk '{print $3}' | head -1 || true)
          FAIL=$(grep -oE '^# fail [0-9]+' test-output.txt | awk '{print $3}' | head -1 || true)

          {
            echo "### Test suite"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| pass | ${PASS:-unknown} |"
            echo "| fail | ${FAIL:-unknown} |"
            echo "| skipped | ${SKIPPED:-unknown} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # AN UNPARSEABLE RUN IS NOT A CLEAN RUN.
          #
          # If the summary line is missing — the reporter changed, the output was
          # truncated, the step died early — then completeness is UNKNOWN, and
          # defaulting it to zero would print "nothing skipped" and manufacture
          # exactly the false all-clear this step exists to prevent. Say so
          # instead.
          if [ -z "$SKIPPED" ]; then
            echo "> **Could not determine how many tests were skipped.** No \`# skipped\` line in the output, so this run's completeness is unknown — do not read it as complete." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Suite completeness unknown::No '# skipped' summary line found in the test output. Completeness could not be verified."
          elif [ "$SKIPPED" -gt 0 ]; then
            {
              echo "> **The legacy money-path concurrency suite did not run in this job.**"
              echo ">"
              echo "> \`${SKIPPED}\` test(s) skipped because this job has no integration"
              echo "> database. The confirmation and pass-minting cases — the only"
              echo "> real-database coverage of the legacy money path — were NOT exercised"
              echo "> by this run. This is expected in this job and does not fail the build."
              echo ">"
              echo "> The Event database and concurrency suites are NOT covered by this"
              echo "> note: they run in the \`event-database\` job, where a skip or a"
              echo "> failure fails the build."
              echo ">"
              echo "> To run them locally:"
              echo "> \`npm run test:db:up && npm run test:integration && npm run test:db:down\`"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::warning title=Concurrency suite did not run::${SKIPPED} test(s) skipped — no integration database. The money-path concurrency cases were not exercised. Expected in CI; run npm run test:db:up locally to cover them."
          else
            echo "All tests ran; nothing skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # EVENT DATABASE AND CONCURRENCY SUITES — L0 step 7.
  #
  # WHY. The Event engine's guarantees are concurrency guarantees: 20 RSVPs
  # against 10 seats must admit exactly 10, ten claims on the last position of
  # a shift must admit exactly one. Those are proven only against a real
  # database, and until this job they ran on one developer machine and nowhere
  # else — every CI run skipped them.
  #
  # ISOLATED BY CONSTRUCTION. The database is the repository's own disposable
  # container (`npm run test:db:up`, scripts/test-db.mjs): Postgres in Docker on
  # the runner, schema built by replaying prisma/migrations and then asserted
  # equal to schema.prisma. It is created by this job and destroyed with the
  # runner. This job has no secrets and no Supabase credential; the only
  # connection string in it is the container's fixed local one, which is
  # committed in scripts/test-db.mjs and reaches nothing but 127.0.0.1.
  #
  # A SKIP IS A FAILURE HERE. Each suite is `describe(..., { skip: !url })`, so
  # without TEST_DATABASE_URL it reports success having run nothing — and a
  # skipped describe is not reliably counted in the `# skipped` total. So this
  # job does not trust the absence of failures. For every suite it requires the
  # run to have executed at least the known number of tests, all passing, none
  # skipped, cancelled or todo, and it requires the named guarantees below to
  # appear as passing tests.
  # ---------------------------------------------------------------------------
  event-database:
    name: event database and concurrency suites
    runs-on: ubuntu-latest

    env:
      # Same non-functional placeholders as `verify`, for `prisma generate`.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/unused
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/unused
      # The disposable container's own URL, identical to TEST_URL in
      # scripts/test-db.mjs. Local to the runner; not a secret.
      TEST_DATABASE_URL: postgresql://postgres:daali@localhost:55432/daali_test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use Node 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Refuse to go further unless the test URL is the local container. This
      # cannot be anything else today; the check is here so that it cannot
      # quietly become something else later.
      - name: Confirm the test database is local
        shell: bash
        run: |
          case "$TEST_DATABASE_URL" in
            postgresql://postgres:daali@localhost:55432/daali_test) echo "test database: localhost:55432/daali_test (disposable container)";;
            *) echo "::error title=Unexpected test database::TEST_DATABASE_URL is not the disposable local container."; exit 1;;
          esac
          if printf '%s' "$TEST_DATABASE_URL$DATABASE_URL$DIRECT_URL" | grep -qiE 'supabase|pooler'; then
            echo "::error title=Remote database in CI::A Supabase host appears in a database URL."; exit 1
          fi

      # The repository's own script: start the container, replay
      # prisma/migrations, assert the result matches schema.prisma. Any failure
      # exits non-zero and fails the job.
      - name: Start the disposable database and replay migrations
        id: db
        run: npm run test:db:up

      # A real query, not pg_isready, which can report ready while the server is
      # still restarting after first initialisation.
      - name: Wait for the database to answer a query
        id: ready
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 30); do
            if docker exec daali-test-db psql -U postgres -d daali_test -tAc 'select 1' >/dev/null 2>&1; then
              ok=$((ok+1)); [ "$ok" -ge 3 ] && break
            else
              ok=0
            fi
            sleep 1
          done
          [ "$ok" -ge 3 ] || { echo "::error title=Database not ready::No three consecutive successful queries in 30 seconds."; exit 1; }

          # ASSERTED, NOT JUST PRINTED. Every migration folder must be applied,
          # and all twelve Event tables must exist, before a suite runs.
          expected=$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          applied=$(docker exec daali-test-db psql -U postgres -d daali_test -tAc 'select count(*) from _prisma_migrations where finished_at is not null and rolled_back_at is null')
          tables=$(docker exec daali-test-db psql -U postgres -d daali_test -tAc "select count(*) from pg_tables where schemaname='public' and tablename in ('daali_events','daali_event_people','daali_command_executions','daali_registrations','daali_event_person_access_tokens','daali_signup_sheets','daali_signup_slots','daali_helper_signups','daali_helper_signup_positions','daali_signup_logs','daali_registration_logs','daali_notification_deliveries')")
          echo "migrations applied: ${applied} of ${expected}"
          echo "event tables present: ${tables} of 12"
          [ "$applied" = "$expected" ] || { echo "::error title=Migrations not fully applied::${applied} of ${expected} migrations applied in the test database."; exit 1; }
          [ "$tables" = "12" ] || { echo "::error title=Event tables missing::${tables} of 12 Event tables present in the test database."; exit 1; }

      # ONE SUITE AT A TIME, each in its own process, with the exact command its
      # own header documents. They share one database, and the concurrency
      # cases must contend only with themselves.
      #
      # `set -o pipefail` so a failing suite fails the step through `tee`.
      # `--test-reporter=tap` so the summary lines the next step parses are in
      # a fixed format regardless of the runner's terminal.
      #
      # EVERY SUITE RUNS EVEN IF AN EARLIER ONE FAILED, as long as the database
      # came up. A failure in capacity must not hide the state of sign-ups,
      # notifications and the gates. Each failing step still fails the job.
      - name: RSVP capacity (0B)
        if: ${{ !cancelled() && steps.db.outcome == 'success' && steps.ready.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test --test-reporter=tap \
            src/db/capacity.integration.test.ts 2>&1 | tee event-db-capacity.txt

      - name: Sign-up positions (0C)
        if: ${{ !cancelled() && steps.db.outcome == 'success' && steps.ready.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test --test-reporter=tap \
            src/db/signups.integration.test.ts 2>&1 | tee event-db-signups.txt

      - name: Notifications (0D.0)
        if: ${{ !cancelled() && steps.db.outcome == 'success' && steps.ready.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test --test-reporter=tap \
            src/notifications/notification.integration.test.ts 2>&1 | tee event-db-notifications.txt

      - name: Gate independence T1–T7
        if: ${{ !cancelled() && steps.db.outcome == 'success' && steps.ready.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --experimental-test-module-mocks \
            --import ./scripts/test-alias-only.mjs --test --test-reporter=tap \
            src/lib/event-gate-independence.integration.test.ts 2>&1 | tee event-db-gates.txt

      # THE COMPLETENESS GATE. Runs whatever happened above, so the summary
      # table is always written, and refuses to accept a zero exit as proof:
      # a suite that skipped itself also exits zero. Any shortfall here FAILS
      # the job — never a warning. A suite that did not run at all (for
      # example because the database never came up) is reported as such.
      - name: Require every Event database test to have run and passed
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          total_tests=0; total_pass=0; total_fail=0; total_skip=0

          num() { grep -oE "^# $2 [0-9]+" "$1" | awk '{print $3}' | tail -1 || true; }

          {
            echo "### Event database and concurrency suites"
            echo ""
            echo "| suite | tests | pass | fail | skipped | cancelled | todo | required at least |"
            echo "|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          check_suite() {
            local label="$1" file="$2" min="$3"
            if [ ! -s "$file" ]; then
              echo "::error title=$label::No output file. The suite did not run."; status=1; return
            fi
            local t p f s c d
            t=$(num "$file" tests); p=$(num "$file" pass); f=$(num "$file" fail)
            s=$(num "$file" skipped); c=$(num "$file" cancelled); d=$(num "$file" todo)
            echo "| $label | ${t:-?} | ${p:-?} | ${f:-?} | ${s:-?} | ${c:-?} | ${d:-?} | $min |" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$t" ] || [ -z "$p" ] || [ -z "$f" ] || [ -z "$s" ] || [ -z "$c" ] || [ -z "$d" ]; then
              echo "::error title=$label::Could not read the test summary. Completeness unknown, treated as failure."; status=1; return
            fi
            total_tests=$((total_tests+t)); total_pass=$((total_pass+p)); total_fail=$((total_fail+f)); total_skip=$((total_skip+s))
            [ "$t" -ge "$min" ] || { echo "::error title=$label::Only $t test(s) ran; at least $min are required. A skipped suite looks like this."; status=1; }
            [ "$p" -eq "$t" ]   || { echo "::error title=$label::$p of $t test(s) passed."; status=1; }
            [ "$f" -eq 0 ]      || { echo "::error title=$label::$f test(s) failed."; status=1; }
            [ "$s" -eq 0 ]      || { echo "::error title=$label::$s test(s) skipped. A skip is a failure in this job."; status=1; }
            [ "$c" -eq 0 ]      || { echo "::error title=$label::$c test(s) cancelled."; status=1; }
            [ "$d" -eq 0 ]      || { echo "::error title=$label::$d test(s) marked todo."; status=1; }
            if grep -qE '# SKIP|# TODO' "$file"; then
              echo "::error title=$label::A SKIP or TODO directive appears in the output."; status=1
            fi
          }

          # Minimums are the number of tests each file holds today. Adding tests
          # never needs a change here; removing or skipping one does.
          check_suite "RSVP capacity (0B)"        event-db-capacity.txt       5
          check_suite "Sign-up positions (0C)"    event-db-signups.txt        6
          check_suite "Notifications (0D.0)"      event-db-notifications.txt  5
          check_suite "Gate independence T1–T7"   event-db-gates.txt          7

          # THE NAMED GUARANTEES. Each must appear as a passing test, by name.
          # `ok N - name # SKIP reason` is also an "ok" line, so skipped and
          # todo lines are removed first: this check stands on its own.
          require_ok() {
            local file="$1" name="$2"
            if [ -s "$file" ] && grep -E '^[[:space:]]*ok [0-9]+ - ' "$file" | grep -vE '# (SKIP|TODO)' | grep -qF -- "$name"; then
              echo "- passed: $name" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **MISSING OR NOT PASSING: $name**" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Required guarantee did not pass::$name"; status=1
            fi
          }
          { echo ""; echo "Required guarantees:"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          require_ok event-db-capacity.txt "20 concurrent RSVPs against 10 seats"
          require_ok event-db-capacity.txt "10 concurrent parties of 3 against 10 seats"
          require_ok event-db-capacity.txt "cancellation frees seats"
          require_ok event-db-capacity.txt "one live registration per person"
          require_ok event-db-signups.txt  "10 parallel claims on the FINAL available position (capacity 1)"
          require_ok event-db-signups.txt  "8 parallel claims against a 3-person shift"
          require_ok event-db-signups.txt  "4 parallel claims of 2 cases against a 6-case item"
          require_ok event-db-signups.txt  "composite FK integrity"
          require_ok event-db-signups.txt  "cancellation frees positions for reuse"
          require_ok event-db-notifications.txt "A failed email must never roll back or invalidate the RSVP"

          {
            echo ""
            echo "**Total: ${total_tests} tests, ${total_pass} passed, ${total_fail} failed, ${total_skip} skipped.**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "EVENT DATABASE SUITES: tests=${total_tests} pass=${total_pass} fail=${total_fail} skipped=${total_skip}"

          if [ "$status" -ne 0 ]; then
            echo "> **This job failed.** See the errors above." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Remove the disposable database
        if: always()
        run: npm run test:db:down
